server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Nén gzip cho asset tĩnh
    gzip on;
    gzip_vary on;
    gzip_types text/plain text/css application/json application/javascript
               application/x-javascript text/xml application/xml text/javascript
               image/svg+xml;

    # Cache asset có hash trong tên
    location /assets/ {
        expires 1y;
        access_log off;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Proxy /api → backend service (trong cùng compose network)
    location /api/ {
        proxy_pass         http://backend:3001/api/;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
        # Cho phép upload file báo cáo / avatar nếu cần
        client_max_body_size 10m;
    }

    # Healthcheck trực tiếp cho nginx
    location = /health {
        access_log off;
        return 200 "ok\n";
        add_header Content-Type text/plain;
    }

    # SPA fallback — React Router deep links
    location / {
        try_files $uri $uri/ /index.html;
    }
}
